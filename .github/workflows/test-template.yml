name: Test template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Configure git identity for copier
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v make || choco install make -y --no-progress

      - name: make test (bash / zsh)
        shell: bash
        run: make test

      - name: make test (Windows cmd, no POSIX tools)
        if: runner.os == 'Windows'
        shell: cmd
        run: make SHELL=cmd.exe test
