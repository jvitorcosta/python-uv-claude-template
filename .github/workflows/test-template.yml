name: Test template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Configure git identity for copier
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v make || choco install make -y --no-progress

      - name: make test (bash / zsh)
        shell: bash
        run: make test

      - name: make test (Windows cmd, no POSIX tools)
        if: runner.os == 'Windows'
        shell: cmd
        run: make SHELL=cmd.exe test
